[package]
name = "jj-agentic-launcher"
version = "1.3.0"
edition = "2021"
description = "Launch Claude Code or Codex with shared scene prompts"
repository = "https://github.com/yigegongjiang/jj-agentic-launcher"
license = "MIT"

[[bin]]
name = "jj-agentic-launcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
